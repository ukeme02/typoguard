<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TypoGuard Discovery Tests</title>
</head>
<body>
  <div id="test-results"></div>
  <!-- Part A: fixture elements -->
  <textarea id="fx-textarea"></textarea>
  <div id="fx-ce-true" contenteditable="true"></div>
  <div id="fx-ce-empty" contenteditable=""></div>
  <div id="fx-ce-bare" contenteditable></div>
  <div id="fx-ce-plaintext" contenteditable="plaintext-only"></div>
  <div id="fx-ce-false" contenteditable="false"></div>
  <div id="fx-ce-banana" contenteditable="banana"></div>
  <textarea id="fx-hidden" style="display:none"></textarea>
  <textarea id="fx-disabled" disabled></textarea>
  <textarea id="fx-readonly" readonly></textarea>
  <script src="../discovery.js"></script>
  <script>
    // Ensure discovery.js has run its initial registration via calling registerAllEditors
    // and start the observer to catch dynamic changes.
    registerAllEditors();
    startEditorObserver();

    let passed = 0;
    const total = 10; // Updated to reflect new assertions

    function assert(name, condition) {
      const resultsDiv = document.getElementById('test-results');
      const line = document.createElement('div');
      if (condition) {
        console.log(`PASS: ${name}`);
        passed++;
        line.textContent = `${name} … PASS`;
        line.style.color = 'green';
      } else {
        console.log(`FAIL: ${name}`);
        line.textContent = `${name} … FAIL`;
        line.style.color = 'red';
      }
      resultsDiv.appendChild(line);
    }

    // Helper to get registry snapshot
    function getRegistryInfo() {
      const debug = typoGuardDebug();
      return {
        size: debug.registrySize,
        ids: new Set(debug.editors.map(e => e.domId).filter(id => id !== null))
      };
    }

    // Wait a bit for any microtasks
    setTimeout(() => {
      const info = getRegistryInfo();

      // A1: registrySize is exactly 5
      assert('A1', info.size === 5);

      // A2: the registered domIds are exactly {fx-textarea, fx-ce-true, fx-ce-empty, fx-ce-bare, fx-ce-plaintext}
      const expectedIds = new Set(['fx-textarea', 'fx-ce-true', 'fx-ce-empty', 'fx-ce-bare', 'fx-ce-plaintext']);
      assert('A2',
        info.ids.size === expectedIds.size &&
        [...info.ids].every(id => expectedIds.has(id)) &&
        [...expectedIds].every(id => info.ids.has(id))
      );

      // A3: none of {fx-ce-false, fx-ce-banana, fx-hidden, fx-disabled, fx-readonly} are registered
      const forbidden = new Set(['fx-ce-false', 'fx-ce-banana', 'fx-hidden', 'fx-disabled', 'fx-readonly']);
      assert('A3',
        [...info.ids].every(id => !forbidden.has(id))
      );

      // Dynamic tests
      // A4: append a new <textarea> with id fx-dyn-1 → registrySize becomes 6 and fx-dyn-1 is registered; then remove it → registrySize returns to 5
      const dyn1 = document.createElement('textarea');
      dyn1.id = 'fx-dyn-1';
      document.body.appendChild(dyn1);
      setTimeout(() => {
        const info4 = getRegistryInfo();
        assert('A4a', info4.size === 6 && info4.ids.has('fx-dyn-1'));
        // Remove it
        document.body.removeChild(dyn1);
        setTimeout(() => {
          const info4b = getRegistryInfo();
          assert('A4b', info4b.size === 5 && !info4b.ids.has('fx-dyn-1'));

          // A5: append a div with contenteditable="false" (id fx-dyn-false) → registrySize STAYS 5
          const dynFalse = document.createElement('div');
          dynFalse.id = 'fx-dyn-false';
          dynFalse.setAttribute('contenteditable', 'false');
          document.body.appendChild(dynFalse);
          setTimeout(() => {
            const info5 = getRegistryInfo();
            assert('A5', info5.size === 5 && !info5.ids.has('fx-dyn-false'));
            document.body.removeChild(dynFalse);

            // A6: privacy — assert every entry returned by typoGuardDebug() has keys only within {id, domId, type, tagName, connected}; no value, no text content
            const debugFinal = typoGuardDebug();
            const validKeys = new Set(['id', 'domId', 'type', 'tagName', 'connected']);
            const ok = debugFinal.editors.every(entry => {
              const keys = Object.keys(entry);
              return keys.every(k => validKeys.has(k));
            });
            assert('A6', ok);

            // A7: subscribe to "registered", dynamically add a textarea → callback fires with a record containing an id
            let registeredFired = false;
            const unsubscribeRegister = onEditorsChanged('registered', (record) => {
              registeredFired = true;
              // We can also check that record has an id
              if (!record.id) {
                throw new Error('Record missing id');
              }
            });
            const dyn7 = document.createElement('textarea');
            dyn7.id = 'fx-dyn-7';
            document.body.appendChild(dyn7);
            setTimeout(() => {
              assert('A7', registeredFired);
              // Clean up
              document.body.removeChild(dyn7);
              unsubscribeRegister(); // clean up subscription

              // A8: subscribe to "deregistered", remove that editor → callback fires
              let deregisteredFired = false;
              const unsubscribeDeregister = onEditorsChanged('deregistered', (record) => {
                deregisteredFired = true;
                // Check record has an id
                if (!record.id) {
                  throw new Error('Record missing id');
                }
              });
              const dyn8 = document.createElement('textarea');
              dyn8.id = 'fx-dyn-8';
              document.body.appendChild(dyn8);
              setTimeout(() => {
                // Now remove it
                document.body.removeChild(dyn8);
                setTimeout(() => {
                  assert('A8', deregisteredFired);
                  unsubscribeDeregister(); // clean up

                  // A9: the unsubscribe function works — after unsubscribing, further add/remove triggers no callback
                  let registeredFired9 = false;
                  let deregisteredFired9 = false;
                  const unsubscribeRegister9 = onEditorsChanged('registered', (record) => { registeredFired9 = true; });
                  const unsubscribeDeregister9 = onEditorsChanged('deregistered', (record) => { deregisteredFired9 = true; });
                  // Unsubscribe immediately
                  unsubscribeRegister9();
                  unsubscribeDeregister9();
                  // Now add and remove an editor
                  const dyn9 = document.createElement('textarea');
                  dyn9.id = 'fx-dyn-9';
                  document.body.appendChild(dyn9);
                  setTimeout(() => {
                    document.body.removeChild(dyn9);
                    setTimeout(() => {
                      assert('A9', !registeredFired9 && !deregisteredFired9);
                      // Clean up subscriptions (though we already unsubscribed, but to be safe)
                      // Actually, we already unsubscribed above, so these are no-ops
                      // unsubscribeRegister9();
                      // unsubscribeDeregister9();

                      // Final summary
                      const summary = document.createElement('div');
                      summary.textContent = `${passed}/${total} assertions passed`;
                      summary.style.fontWeight = 'bold';
                      document.getElementById('test-results').appendChild(summary);

                    }, 50);
                  }, 50);
                }, 50);
              }, 50);
            }, 50);
          }, 50);
        }, 50);
      }, 50);
    }, 50);
  </script>
</body>
</html>
